<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background removed for transparency -->
  
  <!-- Robot Head (Glassmorphic vibe) -->
  <rect x="25" y="25" width="50" height="50" rx="12" fill="#1C2333" stroke="#00FFCC" stroke-width="3" />
  
  <!-- Eyes -->
  <circle cx="38" cy="45" r="7" fill="#FF5722">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="62" cy="45" r="7" fill="#FF5722">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Antenna Base -->
  <rect x="45" y="15" width="10" height="10" fill="#00FFCC" />
  <circle cx="50" cy="12" r="4" fill="#FF5722">
    <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Mouth / Grill -->
  <rect x="35" y="62" width="30" height="3" rx="1.5" fill="#00FFCC" />
  <rect x="40" y="68" width="20" height="2" rx="1" fill="#00FFCC" opacity="0.6" />
</svg>
